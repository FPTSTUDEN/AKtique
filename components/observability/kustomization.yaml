# components/observability/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1alpha1 # Use v1alpha1 for components
kind: Component

# This component can be included in any overlay
# It doesn't create resources itself, but provides configurations
# that are applied via Helm or as ConfigMaps

# We'll use generators to create ConfigMaps from files
configMapGenerator:
# Grafana dashboards
- name: grafana-dashboards
  namespace: monitoring
  files:
  - dashboards/cluster.json
  - dashboards/services.json
  - dashboards/business.json
  # - dashboards/istio-mesh.json
  # - dashboards/istio-workload.json
  # - dashboards/istio-service.json
  options:
    labels:
      grafana_dashboard: "1"

# Prometheus rules
- name: prometheus-rules
  namespace: monitoring
  files:
  - prometheus/rules/recording-rules.yaml
  - prometheus/rules/alerting-rules.yaml
  options:
    labels:
      prometheus_rule: "1"

# Prometheus service monitors
- name: prometheus-service-monitors
  namespace: monitoring
  files:
  - prometheus/service-monitors/istio-monitors.yaml
  # - prometheus/service-monitors/app-monitors.yaml
  options:
    labels:
      prometheus_servicemonitor: "1"

# This component references the Helm values
# but doesn't install Helm charts directly
# (That's done by the installation script)