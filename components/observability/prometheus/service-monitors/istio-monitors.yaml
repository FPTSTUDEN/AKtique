# components/observability/prometheus/service-monitors/istio-monitors.yaml
# These are the critical ones - scrape Istio metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istiod-monitor
  namespace: istio-system
  labels:
    app: istio
spec:
  selector:
    matchLabels:
      app: istiod
  endpoints:
  - port: http-monitoring
    path: /metrics
    interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istio-ingress-monitor
  namespace: istio-system
  labels:
    app: istio
spec:
  selector:
    matchLabels:
      app: istio-ingressgateway
  endpoints:
  - port: http-envoy-prom
    path: /stats/prometheus
    interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-monitor
  namespace: default
  labels:
    app: istio
spec:
  selector:
    matchExpressions:
    - key: istio-envoy
      operator: Exists
  endpoints:
  - port: http-envoy-prom
    path: /stats/prometheus
    interval: 15s
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_label_app]
      targetLabel: service
      action: replace
    - sourceLabels: [__meta_kubernetes_pod_label_version]
      targetLabel: version
      action: replace