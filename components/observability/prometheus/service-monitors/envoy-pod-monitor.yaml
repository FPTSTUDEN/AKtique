apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-pod-monitor
  namespace: default
  labels:
    app: istio
spec:
  selector:
    matchLabels:
      security.istio.io/tlsMode: istio
  podMetricsEndpoints:
  - port: http-envoy-prom
    path: /stats/prometheus
    interval: 15s
