# components/observability/helm-values/prometheus-values.yaml
prometheus:
  prometheusSpec:
    # Discover all ServiceMonitors and PodMonitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    
    # Retention and storage
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    
    # Additional scrape configs for Istio
    additionalScrapeConfigs:
      - job_name: 'istio-mesh'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - istio-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: 'istiod|istio-ingressgateway'

grafana:
  enabled: true
  
  # Configure Grafana to load dashboards from ConfigMaps
  additionalDataSources:
    # - name: Prometheus
    #   type: prometheus
    #   url: http://prometheus-kube-prometheus-prometheus:9090
    #   access: proxy
    #   isDefault: true
    - name: Jaeger
      type: jaeger
      url: http://jaeger-query.istio-system:16686
      access: proxy
      isDefault: false  # ⚠️ MUST be false!
      editable: true
      jsonData:
        nodeGraph:
          enabled: true
        traceQuery:
          timeShiftEnabled: true
          spanLimit: 1000

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  
  # Dashboard providers configuration
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
      - name: 'istio'
        orgId: 1
        folder: 'Istio'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/istio