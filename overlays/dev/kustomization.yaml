# overlays/dev/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
# Use local images (Skaffold will build)
# images:
# - name: frontend
#   newName: frontend
#   newTag: latest
# - name: adservice
#   newName: adservice
#   newTag: latest
# ... repeat for all services
kind: Kustomization
# Add development-specific resources
# - dev-services.yaml  # Optional: dev-specific services
# - ../../components/observability/  # Include observability in dev
resources:
  - ../../base
  - port-forward.yaml
components:
  - ../../components/istio
  - ../../components/observability
# Development-specific patches
# - reduce-resources.yaml  # Lower resource limits for dev
# Development labels
labels:
- includeSelectors: true
  pairs:
    environment: dev
# patches:
# - patch: disable-autoscaling.yaml
# - patch: enable-debug.yaml
