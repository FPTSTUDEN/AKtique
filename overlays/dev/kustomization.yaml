# overlays/dev/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Use local images (Skaffold will build)
# images:
# - name: frontend
#   newName: frontend
#   newTag: latest
# - name: adservice
#   newName: adservice
#   newTag: latest
# ... repeat for all services

# Add development-specific resources
resources:
# - dev-services.yaml  # Optional: dev-specific services
- ../../base
# - ../../components/observability/  # Include observability in dev
- ../../components/istio/          # Optional: include Istio if testing

# Development-specific patches
patchesStrategicMerge:
# - reduce-resources.yaml  # Lower resource limits for dev
- disable-autoscaling.yaml
- enable-debug.yaml

# Development labels
commonLabels:
  environment: dev