# overlays/dev/port-forward.yaml
apiVersion: v1
kind: Service
metadata:
  name: frontend-port-forward
  namespace: default
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-port-forward
  namespace: istio-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
  - name: service
    port: 3000
    targetPort: 3000
    nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-port-forward
  namespace: istio-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    nodePort: 30909
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-port-forward
  namespace: istio-system
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
  - name: query
    port: 16686
    targetPort: 16686
    nodePort: 31686
---
apiVersion: v1
kind: Service
metadata:
  name: kiali-port-forward
  namespace: istio-system
spec:
  type: NodePort
  selector:
    app: kiali
  ports:
  - name: http
    port: 20001
    targetPort: 20001
    nodePort: 32001